<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Authorized</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; font-family: "gg sans", "Helvetica Neue", Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .check { width: 20vw; max-width: 140px; min-width: 80px; aspect-ratio: 1; border-radius: 50%; background: #ff8c00; display: flex; align-items: center; justify-content: center; }
  .check svg { width: 55%; }
  h1 { color: #ff8c00; font-size: 12vw; margin: 0; font-weight: 800; }
  p { color: #ff8c00; opacity: .8; font-size: 4.5vw; margin: 0; }
  @media (min-width: 700px) { h1 { font-size: 90px; } p { font-size: 24px; } }
</style>
</head>
<body>
  <div class="check">
    <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
  </div>
  <h1>Authorized</h1>
  <p>You can now close this tab.</p>
</body>
</html>
