<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BirdQuestX</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}

/* Full screen stage; image stretches to fill, buttons are placed in % of the screen */
.stage{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  container-type:inline-size;
}
.stage img.bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
}

.btn{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  font-weight:700;
  text-decoration:none;
  background:transparent;
}
.play{left:38.6%;top:64.7%;width:16.6%;height:9.8%;font-size:4.8cqw;color:#030303}
.shop{left:38.9%;top:74.3%;width:15.6%;height:7.3%;font-size:3.4cqw;color:#050505}
.about{right:0;bottom:0;width:15.6%;height:7.3%;font-size:1.8cqw;color:#fff;background:#090606}
</style>
</head>
<body>

<main class="stage">
  <img class="bg" src="BQX%20assets/Menus/BirdQuestX.png" alt="">
  <a class="btn play"  href="Game/index.html">Play</a>
  <a class="btn shop"  href="Extra/Shop.html">Shop</a>
  <a class="btn about" href="Extra/about.html">About</a>
</main>

</body>
</html>
