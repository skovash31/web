<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BirdQuestX</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}

/* Full screen stage; image stretches to fill, buttons are placed in % of the screen */
.stage{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  container-type:inline-size;
}
.stage img.bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
}

.account-note{
  position:absolute;
  left:50%;
  top:58%;
  transform:translateX(-50%);
  margin:0;
  padding:0.45rem 0.8rem;
  border-radius:999px;
  background:rgba(0,0,0,0.55);
  color:#fff;
  font-size:clamp(0.7rem, 1.6cqw, 1.1rem);
  font-weight:700;
  letter-spacing:0.03em;
  text-align:center;
  white-space:nowrap;
  display:none;
}

.btn{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  font-weight:700;
  text-decoration:none;
  background:transparent;
}
.play{left:38.6%;top:64.7%;width:16.6%;height:9.8%;font-size:4.8cqw;color:#030303}
.shop{left:38.9%;top:74.3%;width:15.6%;height:7.3%;font-size:3.4cqw;color:#050505}
.about{right:0;bottom:0;width:15.6%;height:7.3%;font-size:1.8cqw;color:#fff;background:#090606}
</style>
</head>
<body>

<main class="stage">
  <img class="bg" src="BQX%20assets/Menus/BirdQuestX.png" alt="">
  <p class="account-note" id="accountNote">You need an account to play this game.</p>
  <a class="btn play" id="playBtn" href="Game/index.html">Play</a>
  <a class="btn shop" href="Extra/Shop.html">Shop</a>
  <a class="btn about" href="Extra/about.html">About</a>
</main>

<script>
  const playBtn = document.getElementById('playBtn');
  const accountNote = document.getElementById('accountNote');
  const accountKey = 'birdQuestXAccount';

  function hasAccount() {
    try {
      const value = localStorage.getItem(accountKey);
      return Boolean(value && value !== 'null' && value !== 'logged-out');
    } catch (error) {
      return false;
    }
  }

  if (!hasAccount()) {
    accountNote.style.display = 'block';
    playBtn.href = 'index.html';
  } else {
    accountNote.style.display = 'none';
    playBtn.href = 'Game/index.html';
  }
</script>

</body>
</html>
