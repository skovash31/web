<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;font-family:system-ui,sans-serif}
body{display:grid;place-items:center}

/* 3:2 stage that scales to any screen; button is placed in % of the stage */
.stage{
  position:relative;
  width:min(100vw, 150vh);
  aspect-ratio:3/2;
  overflow:hidden;
  background:#fff;
  container-type:inline-size;
}
.stage img.bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
}

.btn{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  font-weight:700;
  text-decoration:none;
  background:transparent;
}
.play{left:30%;top:64.7%;width:40%;height:9.8%;font-size:4.8cqw;color:#030303;white-space:nowrap}
</style>
</head>
<body>

<main class="stage">
  <img class="bg" src="../BQX%20assets/Menus/BirdQuestX.png" alt="">
  <a class="btn play" href="game/game.html">Start Fight</a>
</main>

</body>
</html>
