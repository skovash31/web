<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title>
<style>
  :root { --bg: #000; --card: #282929; --field: #e5e9ff; --text: #fff; --ink: #222; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
  }
  main {
    width: min(360px, 92vw);
    padding: 36px 32px;
    background: var(--card);
    border-radius: 14px;
  }
  h1 { margin: 0 0 28px; font-size: 24px; font-weight: 700; text-align: center; }
  form { display: grid; gap: 18px; }
  label { display: grid; gap: 8px; font-size: 14px; }
  input, button {
    width: 100%;
    height: 44px;
    border-radius: 8px;
    font: inherit;
    font-size: 16px;
  }
  input { padding: 0 12px; border: 0; background: var(--field); color: var(--ink); }
  button { border: 0; cursor: pointer; font-weight: 600; }
  .primary { margin-top: 6px; background: var(--field); color: var(--ink); }
  .error { margin: 12px 0 0; min-height: 18px; font-size: 13px; color: #ff8a8a; text-align: center; }
  .divider { margin: 22px 0; text-align: center; font-size: 13px; opacity: .6; }
  .google { background: transparent; color: var(--field); border: 1px solid #5a5c5c; font-weight: 500; }
  .signup { margin: 24px 0 0; font-size: 13px; text-align: center; opacity: .85; }
  a { color: var(--field); }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--field); outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <h1>Log in</h1>
    <form id="loginForm">
      <label>Email <input type="email" name="user" autocomplete="email" required></label>
      <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Log in</button>
    </form>
    <p class="divider">or</p>
    <button class="google" id="googleBtn" type="button">Sign in with Google</button>
    <p class="error" id="error" role="alert"></p>
    <p class="signup">Don't have an account? <a href="signup.html">Sign up</a></p>
  </main>

  <script type="module">
    import {
      GoogleAuthProvider,
      signInWithEmailAndPassword,
      signInWithPopup,
      auth,
      database,
      ref,
      set
    } from "./accounts/firebase.js";
    const accountKey = 'birdQuestXAccount';

    async function rememberAccount(user) {
      const userName = user.displayName || user.email || 'Player';
      await set(ref(database, `playerIds/${user.uid}`), user.uid);
      await set(ref(database, `users/${user.uid}/profile`), {
        playerId: user.uid,
        username: userName
      });
      localStorage.setItem(accountKey, JSON.stringify({
        username: userName,
        playerId: user.uid,
        uid: user.uid,
        loggedIn: true
      }));
    }

    const errorBox = document.getElementById('error');
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.textContent = '';
      const email = document.querySelector('#loginForm input[name="user"]').value.trim();
      const password = document.querySelector('#loginForm input[name="password"]').value;
      try {
        const credential = await signInWithEmailAndPassword(auth, email, password);
        await rememberAccount(credential.user);
        location.href = 'mainpage.html';
      } catch (err) {
        errorBox.textContent = err.message.replace("Firebase: ", "");
      }
    });

    document.getElementById("googleBtn").addEventListener("click", async () => {
      errorBox.textContent = "";
      try {
        const credential = await signInWithPopup(auth, new GoogleAuthProvider());
        await rememberAccount(credential.user);
        location.href = "mainpage.html";
      } catch (err) {
        errorBox.textContent = err.message.replace("Firebase: ", "");
      }
    });
  </script>
</body>
</html>
