<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirby's Secret Games</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        linear-gradient(rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.42)),
        url("../assets/background.png") center / cover fixed no-repeat;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 44px 20px 64px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(52px, 10vw, 128px);
      line-height: 0.95;
      letter-spacing: 0;
      text-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    button,
    select,
    .game-link {
      font: inherit;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: min(720px, 100%);
    }

    .selector {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: min(720px, 100%);
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.38);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
    }

    .selector select {
      min-height: 46px;
      flex: 1 1 260px;
      max-width: 430px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 6px;
      color: #fff;
      background: rgba(0, 0, 0, 0.68);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .selector select:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.9);
      outline-offset: 2px;
    }

    .blank-button,
    .selector button {
      min-height: 46px;
      padding: 10px 18px;
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 6px;
      color: #fff;
      background: rgba(0, 0, 0, 0.42);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .blank-button:hover,
    .blank-button:focus-visible,
    .selector button:hover,
    .selector button:focus-visible {
      transform: translateY(-3px);
      border-color: #fff;
      background: rgba(0, 0, 0, 0.56);
      outline: none;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 20px;
      width: min(1120px, 100%);
    }

    .game-link {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      min-height: 238px;
      padding: 14px;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.65);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.42);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      text-decoration: none;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .game-link:hover,
    .game-link:focus-visible {
      transform: translateY(-6px);
      border-color: #fff;
      background: rgba(0, 0, 0, 0.56);
      outline: none;
    }

    .game-link img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      display: block;
      background: rgba(255, 255, 255, 0.14);
    }

    .game-link span {
      align-self: center;
      overflow-wrap: anywhere;
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 800;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.55);
    }
  </style>
</head>
<body>
  <main>
    <h1>Kirby's Secret Games</h1>

    <div class="top-actions">
      <button class="blank-button" type="button" id="open-page-blank">Open Page in about:blank</button>
    </div>

    <div class="selector">
      <select id="game-select" aria-label="Game selector"></select>
      <button type="button" id="play-selected">Play Selected</button>
    </div>

    <div class="games" id="games"></div>
  </main>

  <script>
    const games = [
          ];

    const gameSelect = document.querySelector("#game-select");
    const gamesContainer = document.querySelector("#games");
    const openPageBlankButton = document.querySelector("#open-page-blank");
    const playSelectedButton = document.querySelector("#play-selected");
    const pressedKeys = new Set();
    let regularPageOpened = false;

    function openPageInAboutBlank() {
      const pageUrl = window.location.href;
      const tab = window.open("about:blank", "_blank");

      if (!tab) {
        alert("Please allow popups for this site to open about:blank.");
        return;
      }

      tab.document.open();
      tab.document.write(`
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <title>Kirby's Secret Games</title>
          <style>
            html,
            body {
              width: 100%;
              height: 100%;
              margin: 0;
              overflow: hidden;
              background: #000;
            }

            iframe {
              width: 100%;
              height: 100%;
              border: 0;
              display: block;
            }
          </style>
        </head>
        <body>
          <iframe src="${pageUrl}" allowfullscreen></iframe>
        </body>
        </html>
      `);
      tab.document.close();
    }

    function playSelectedGame() {
      if (!gameSelect.value) {
        return;
      }

      window.location.href = gameSelect.value;
    }

    function returnToRegularPage() {
      if (regularPageOpened) {
        return;
      }

      regularPageOpened = true;
      window.location.href = "../index.html";
    }

    gameSelect.innerHTML = games.map((game) => `
      <option value="${game.url}">${game.title}</option>
    `).join("");

    gamesContainer.innerHTML = games.map((game) => `
      <a class="game-link" href="${game.url}" aria-label="Play ${game.title}">
        <img src="${game.icon}" alt="${game.iconAlt}" loading="lazy">
        <span>${game.title}</span>
      </a>
    `).join("");

    openPageBlankButton.addEventListener("click", openPageInAboutBlank);
    playSelectedButton.addEventListener("click", playSelectedGame);

    window.addEventListener("keydown", (event) => {
      pressedKeys.add(event.code);

      if (pressedKeys.has("Digit9") && pressedKeys.has("Digit0")) {
        returnToRegularPage();
      }
    });

    window.addEventListener("keyup", (event) => {
      pressedKeys.delete(event.code);
    });
  </script>
</body>
</html>
