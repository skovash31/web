<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enter Password</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .box {
    background: #1c1c1c;
    padding: 2rem 2.5rem;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  input {
    padding: 0.6rem;
    font-size: 1rem;
    border-radius: 6px;
    border: 1px solid #444;
    background: #222;
    color: #eee;
    outline: none;
    width: 200px;
  }
  button {
    padding: 0.6rem 1.2rem;
    font-size: 1rem;
    margin-left: 0.5rem;
    border: none;
    border-radius: 6px;
    background: #4a7dff;
    color: white;
    cursor: pointer;
  }
  button:hover {
    background: #3a63d1;
  }
  #error {
    color: #ff6b6b;
    margin-top: 0.8rem;
    height: 1.2em;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="box">
  <h2>Whats the password twin</h2>
  <div>
    <input type="password" id="pw" placeholder="Enter password" autofocus>
    <button onclick="checkPassword()">Enter</button>
  </div>
  <div id="error"></div>
</div>

<script>
  // Change this to whatever password you want
  const CORRECT_PASSWORD = "KirbyV90";

  function checkPassword() {
    const entered = document.getElementById("pw").value;
    const errorEl = document.getElementById("error");

    if (entered === CORRECT_PASSWORD) {
      window.location.href = "secretindex.html";
    } else {
      window.location.href = "stickbugged.mp4";
    }
  }

  // Allow pressing Enter to submit
  document.getElementById("pw").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      checkPassword();
    }
  });
</script>

</body>
</html>
