<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThatOneIdleCat.shop</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;color:#e8e0f5;background:#0b0b0f}
  section{display:none;min-height:100vh;max-width:900px;margin:0 auto;padding:40px 20px;box-sizing:border-box;flex-direction:column}
  section.on{display:flex}
  #About{background:#150d20;max-width:none}
  #About > *{max-width:860px;width:100%;margin-left:auto;margin-right:auto}
  h1{font-size:40px;margin:20px 0 40px;text-align:center;color:#fff}
  h2{font-size:32px;margin:0 0 16px;text-align:center;font-weight:600}
  p{font-size:18px;line-height:1.5;margin:0 0 12px}
  .center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  a.yt{color:#b57bff;font-size:18px}
  .btn{display:inline-block;background:#7b2cbf;color:#fff;font-size:16px;font-weight:700;padding:14px 28px;border:0;border-radius:8px;cursor:pointer;text-decoration:none;font-family:inherit}
  .btn:hover{background:#9d4edd}
  .nav{display:flex;flex-direction:column;align-items:flex-end;gap:10px;margin-top:auto}
  .nav .btn{width:170px;text-align:center;box-sizing:border-box}
  .games{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  @media(max-width:600px){
    h1{font-size:28px}
    .nav{align-items:stretch}
    .nav .btn{width:100%}
  }
</style>
</head>
<body>

<section id="Home" class="on">
  <h1>ThatOneIdleCat.shop</h1>
  <p>This website is owned by<br><a class="yt" href="https://www.youtube.com/@ThatOneIdleCat" target="_blank" rel="noopener">ThatOneIdleCat</a></p>
  <div class="nav">
    <button class="btn" data-go="Games">Games</button>
    <button class="btn" data-go="About">About me</button>
    <button class="btn" data-go="Extra">Extra</button>
    <button class="btn" data-go="Money">Give me money</button>
  </div>
</section>

<section id="About">
  <div class="center">
    <h2>About Me</h2>
    <p>I'm a content creator that posts videos of my cat and I make games too.</p>
  </div>
  <div class="nav"><button class="btn" data-go="Home">Home Page</button></div>
</section>

<section id="Games">
  <div class="center">
    <h1>My games</h1>
    <div class="games">
      <a class="btn" href="BirdQuestX/index.html">Bird Quest X</a>
      <a class="btn" href="Kirby-V1/index.html">Kirby V1</a>
      <a class="btn" href="https://extra.thatoneidlecat.shop/horror%20game/">CAT Incorporated</a>
    </div>
  </div>
  <div class="nav"><button class="btn" data-go="Home">Home</button></div>
</section>

<section id="Extra">
  <div class="center">
    <h1>Extra</h1>
    <div class="games">
      <a class="btn" href="site-builder.html">Website Builder</a>
    </div>
  </div>
  <div class="nav"><button class="btn" data-go="Home">Home</button></div>
</section>

<section id="Money">
  <div class="center">
    <h2>No way to give money rn</h2>
  </div>
  <div class="nav"><button class="btn" data-go="Home">Home</button></div>
</section>

<script>
document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-go]");
  if (!t) return;
  document.querySelectorAll("section").forEach(function (s) {
    s.classList.toggle("on", s.id === t.dataset.go);
  });
  window.scrollTo(0, 0);
});
</script>
</body>
</html>
